name: MuonSAM smoke test

on:
  push:
    paths: ['graduate/**']
  pull_request:
    paths: ['graduate/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graduate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python test_muon_sam.py
