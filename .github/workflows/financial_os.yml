on:
  push:
    branches: [main]
    paths:
      - 'Financial_OS/**'
      - '!Financial_OS/**/*.md'
      - '.github/workflows/financial_os.yml'
    pull_request:
      paths:
        - 'Financial_OS/**'
        - '!Financial_OS/**/*.md'
        - '.github/workflows/financial_os.yml'

defaults:
  run:
    working-directory: Financial_OS

jobs:
  cpp:
    name: C++ build & test (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # clang joined once fmt moved past 10.2.1 (which fails to compile under clang)
        # and FinancialEngine's -flto=auto link option became INTERFACE, so binaries
        # linking its LLVM bitcode get the LTO plugin. The golden masters pass under both.
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Compiler version
        run: ${CXX:-c++} --version | head -1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
  rust:
    name: Rust feeder (fmt, clippy, FFI test)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the local toolchain, so the local fmt and clippy checks predict CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Build the C ABI library the feeder links against
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFINANCIAL_OS_BUILD_TESTS=OFF
          cmake --build build --target financial_engine_c
      - name: fmt, clippy, FFI test
        working-directory: Financial_OS/market_data_feeder
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

  python:
    name: pytest
    runs-on: ubuntu-26.04
    # pytests/test_data_store.py runs against a real Postgres, and fails rather than
    # skips without one, so CI starts the same image Compose uses.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fos
          POSTGRES_PASSWORD: fos
          POSTGRES_DB: fos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fos -d fos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FOS_TEST_DATABASE_URL: postgresql://fos:fos@localhost:5432/fos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        # constraints.txt pins what the local venv runs; unpinned, CI got DuckDB 2.0.0.
        run: >-
          pip install -c constraints.txt pytest "psycopg[binary]" pandas yfinance
          "celery[redis]" fastapi prometheus-fastapi-instrumentator
      - name: Test
        run: pytest

  compose:
    name: Compose stack smoke test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the images and start the stack
        # Only what jobs need: redis and postgres start as dependencies, while
        # Prometheus, Grafana and redis_exporter stay off.
        run: docker compose up -d --build --wait gateway worker ingester
      - name: Seed a synthetic series
        # CI cannot rely on reaching Yahoo, so three made-up symbols stand in.
        run: docker compose exec -T worker python - < ci/seed_synthetic.py
      - name: Smoke test through the gateway
        run: python3 ci/smoke_test.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
