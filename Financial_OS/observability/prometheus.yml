global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8001"]

  - job_name: "worker"
    # One target per replica. static_configs would resolve "worker" through
    # Docker's round-robin DNS to a single IP, silently merging every
    # replica's counters into one series (looks right at scale=1, wrong at 3).
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]