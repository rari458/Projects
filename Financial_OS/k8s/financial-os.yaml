apiVersion: v1
kind: Namespace
metadata:
  name: financial-os
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-os-config
  namespace: financial-os
data:
  REDIS_URL: "redis://redis:6379/0"
---
# Development credentials, as in docker-compose.yml. A real deployment would create
# this Secret out of band instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: financial-os-db
  namespace: financial-os
type: Opaque
stringData:
  POSTGRES_USER: fos
  POSTGRES_PASSWORD: fos
  POSTGRES_DB: market
  FOS_DATABASE_URL: "postgresql://fos:fos@postgres:5432/market"
---
# The market database. Workers reach it over the network through this Service, so
# unlike the old hostPath DuckDB file they can run on any node (ENGINEERING_DECISIONS #11).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: financial-os
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: financial-os
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: financial-os-db
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fos", "-d", "market"]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Postgres 18 images keep data under /var/lib/postgresql, not .../data.
            - name: pgdata
              mountPath: /var/lib/postgresql
  # The volume must stay with its data: postgres-0 may only run where its volume
  # lives (local-path) or the volume must follow it (cloud disk classes).
  # minikube's default "standard" class does neither, and on a 2-node cluster a
  # postgres-0 forced onto the other node came up as a new, empty database
  # (ENGINEERING_DECISIONS #15). So the class is named explicitly: a cluster
  # without it leaves the claim Pending instead of quietly using unsuitable
  # storage. On minikube: minikube addons enable storage-provisioner-rancher.
  # Elsewhere, replace local-path with a class that meets the same requirement.
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: financial-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: financial-os
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: financial-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: financial-os-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: financial-os-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: financial-os
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30801
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: financial-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: financial-os-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: financial-os-config
          env:
            - name: FOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: financial-os-db
                  key: FOS_DATABASE_URL
          resources:
            requests:
              cpu: "250m"
            limits:
              cpu: "1"
---
# The worker image, consuming only the "ingest" queue, so slow downloads from
# Yahoo never occupy a compute worker. Postgres makes concurrent writers safe, so
# the single-writer settings it had under DuckDB (Recreate, a fixed uid) are gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingester
  namespace: financial-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingester
  template:
    metadata:
      labels:
        app: ingester
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingester
          image: financial-os-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "services.celery_app:celery_app", "worker",
                    "--loglevel=info", "--pool=solo", "-Q", "ingest"]
          envFrom:
            - configMapRef:
                name: financial-os-config
          env:
            - name: FOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: financial-os-db
                  key: FOS_DATABASE_URL
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: financial-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60