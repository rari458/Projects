apiVersion: v1
kind: Namespace
metadata:
  name: financial-os
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-os-config
  namespace: financial-os
data:
  REDIS_URL: "redis://redis:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: financial-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: financial-os
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: financial-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: financial-os-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: financial-os-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: financial-os
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30801
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: financial-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: financial-os-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: financial-os-config
          resources:
            requests:
              cpu: "250m"
            limits:
              cpu: "1"
          volumeMounts:
            - name: market-db
              mountPath: /app/market.duckdb
              readOnly: true
      volumes:
        - name: market-db
          hostPath:
            path: /host-mount/market.duckdb
            type: File
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: financial-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60