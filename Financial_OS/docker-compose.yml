# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile.gateway
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      FOS_DATABASE_URL: postgresql://fos:fos@postgres:5432/market
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "9100"
    stop_grace_period: 30s

  # Same image as the worker, but it consumes only the "ingest" queue, so slow
  # downloads from Yahoo never occupy a compute worker.
  ingester:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
    command: ["celery", "-A", "services.celery_app:celery_app", "worker",
              "--loglevel=info", "--pool=solo", "-Q", "ingest"]
    environment:
      REDIS_URL: redis://redis:6379/0
      FOS_DATABASE_URL: postgresql://fos:fos@postgres:5432/market
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  # The market database. Readers and the ingester share it without blocking each
  # other (ENGINEERING_DECISIONS #14 is why DuckDB could not). Host port 5433 is
  # published (a local Postgres may hold 5432) for scripts and pytest.
  # pytest uses its own fos_test database. Development credentials only.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fos
      POSTGRES_PASSWORD: fos
      POSTGRES_DB: market
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fos -d market"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis:6379"
      # Exposes queue backlog as redis_key_size{key="celery"} - the scaling
      # signal decision #11 identified as correct (CPU is a weak proxy here).
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: "celery"
    expose:
      - "9121"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability:/etc/prometheus-config:ro
    command:
      - "--config.file=/etc/prometheus-config/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - worker
      - redis_exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
